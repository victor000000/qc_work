name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust build, lint and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Rehydrate pinned DuckDB native dependency after cache restore
        run: bash scripts/bootstrap_duckdb.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --workspace --release --locked

  python:
    name: Strategy tests (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [s001, s002, sml01, sstrangle]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Run custom-axis and design regressions
        if: matrix.strategy == 'sstrangle'
        run: python -m pytest strategies/sstrangle/poc/v088 strategies/sstrangle/poc/v089 strategies/sstrangle/poc/v090 strategies/sstrangle/poc/v091 strategies/sstrangle/poc/v092 strategies/sstrangle/research/design_20261030_v090
      - name: Run isolated strategy tests
        working-directory: strategies/${{ matrix.strategy }}
        run: python -m pytest tests

  workspace-tools:
    name: Workspace tool regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - uses: Swatinem/rust-cache@v2
      - name: Rehydrate pinned DuckDB native dependency after cache restore
        run: bash scripts/bootstrap_duckdb.sh
      - name: Build native writer for cross-language storage regression
        run: cargo build --locked --bin qc-backtest-server
      - name: Locate downloaded DuckDB runtime
        shell: bash
        run: |
          duckdb_lib=$(find target -name libduckdb.so -print -quit)
          test -n "$duckdb_lib"
          echo "LD_LIBRARY_PATH=$(dirname "$PWD/$duckdb_lib")" >> "$GITHUB_ENV"
      - run: python scripts/check_docs.py
      - run: python -m pytest tests

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
