[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-strategy-s001"
version = "0.1.0"
description = "Isolated cross-sectional fundamental strategy research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "quantconnect-stubs"]

[tool.setuptools]
packages = ["s001", "s001.tools"]
package-dir = {s001 = "."}
