[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "qc-strategy-s002"
version = "0.1.0"
description = "Independent ETF cross-sectional strategy research"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.setuptools]
packages = ["s002"]
package-dir = {s002 = "."}
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
